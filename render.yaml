services:
  # PhishGuard Express Backend API & Threat Gateway
  - type: web
    name: phishguard-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

  # PhishGuard Python FastAPI Machine Learning Microservice
  - type: web
    name: phishguard-ml
    runtime: python
    rootDir: ml_service
    buildCommand: pip install -r requirements.txt && python train_model.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
